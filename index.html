<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <input type="text" placeholder="0" class="txt" id="input">
        <div class="button" >
        <div>
            <button class="btn" style="color: greenyellow;" >AC</button>
            <button class="btn" style="color: greenyellow;" >DEL</button>
            <button class="btn" style="color: greenyellow;" >%</button>
            <button class="btn" style="color: greenyellow;" >/</button>
        </div>
        <div>
            <button class="btn" >7</button>
            <button class="btn" >8</button>
            <button class="btn" >9</button>
            <button class="btn" style="color: greenyellow;" >*</button>
        </div>
        <div>
            <button class="btn" >4</button>
            <button class="btn" >5</button>
            <button class="btn" >6</button>
            <button class="btn" style="color: greenyellow;">-</button>
        </div>
        <div>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn" style="color: greenyellow;" >+</button>
        </div>
        <div>
            <button class="btn">00</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn" style="background-color: rgb(255, 102, 0);color: white;">=</button>
        </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
